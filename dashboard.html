<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard - REST API</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: white; text-align: center; margin-bottom: 25px; font-size: 28px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card .label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
    .card .unit { font-size: 18px; color: #aaa; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .status-online { background: #d4edda; color: #155724; }
    .status-offline { background: #f8d7da; color: #721c24; }
    .panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px; }
    .panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
    .controls { display: flex; gap: 15px; flex-wrap: wrap; }
    .btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-on { background: #28a745; color: white; }
    .btn-on:hover { background: #218838; }
    .btn-off { background: #dc3545; color: white; }
    .btn-off:hover { background: #c82333; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f8f9fa; color: #666; text-transform: uppercase; font-size: 12px; }
    tr:hover td { background: #f9f9f9; }
    #alert-banner { display: none; background: #dc3545; color: white; padding: 14px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .chart-wrap { position: relative; height: 300px; }
    #log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
    #log .error { color: #f66; }
    #log .info { color: #6af; }
  </style>
</head>
<body>
<div class="container">
  <h1>IoT Dashboard - REST API</h1>

  <div id="alert-banner"></div>

  <!-- Kartu Sensor -->
  <div class="cards">
    <div class="card">
      <div class="label">Suhu</div>
      <div class="value" id="suhu">--</div>
      <div class="unit">°C</div>
    </div>
    <div class="card">
      <div class="label">Kelembaban</div>
      <div class="value" id="kelembaban">--</div>
      <div class="unit">%</div>
    </div>
    <div class="card">
      <div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px;">
        <span class="status-badge status-offline" id="status-badge">OFFLINE</span>
      </div>
    </div>
    <div class="card">
      <div class="label">Batas Suhu</div>
      <div class="value" id="batas-nilai" style="color:#f39c12;">--</div>
      <div class="unit">°C</div>
      <div style="margin-top:12px;">
        <input type="number" id="input-batas" step="0.5" min="0" max="100" style="width:80px;padding:6px;border:1px solid #ccc;border-radius:6px;">
        <button class="btn btn-on" style="padding:6px 14px;font-size:13px;" onclick="simpanBatas()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Grafik Chart.js -->
  <div class="panel">
    <h2>Grafik Suhu dan Kelembaban (real-time)</h2>
    <div class="chart-wrap">
      <canvas id="grafik"></canvas>
    </div>
  </div>

  <!-- Kontrol -->
  <div class="panel">
    <h2>Kontrol Perangkat</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
    </div>
  </div>

  <!-- History -->
  <div class="panel">
    <h2>10 Data Sensor Terakhir</h2>
    <table>
      <thead>
        <tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr>
      </thead>
      <tbody id="history-body">
        <tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Log -->
  <div class="panel">
    <h2>Log Aktivitas</h2>
    <div id="log"></div>
  </div>
</div>

<script>
// ==============================
// KONFIGURASI
// ==============================
const API_BASE = 'http://localhost:1880/api';
const WS_URL = 'ws://localhost:1880/ws/sensor';
// Catatan: API key di sisi browser hanya untuk demo praktikum.
// Nilainya harus sama dengan env API_KEY di tab flow Node-RED.
const API_KEY = 'iot-kampus-2026';
const JUMLAH_TITIK_GRAFIK = 20;

async function apiGet(path) {
  const res = await fetch(API_BASE + path, { headers: { 'X-API-Key': API_KEY } });
  const json = await res.json();
  if (res.status === 401) throw new Error('401 API key ditolak');
  return json;
}

async function apiPut(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
    body: JSON.stringify(body)
  });
  const json = await res.json();
  if (res.status === 401) throw new Error('401 API key ditolak');
  return json;
}

async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
    body: JSON.stringify(body)
  });
  const json = await res.json();
  if (res.status === 401) throw new Error('401 API key ditolak');
  return json;
}

// ==============================
// STATE
// ==============================
let riwayat = [];
let batasSekarang = null;
let sedangOver = false;
let dataTerakhir = 0;

// ==============================
// LOG
// ==============================
function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// ==============================
// GRAFIK (Chart.js)
// ==============================
const grafik = new Chart(document.getElementById('grafik'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Suhu (°C)', data: [], borderColor: '#e74c3c', backgroundColor: 'rgba(231,76,60,0.15)', tension: 0.3, yAxisID: 'ySuhu' },
      { label: 'Kelembaban (%)', data: [], borderColor: '#3498db', backgroundColor: 'rgba(52,152,219,0.15)', tension: 0.3, yAxisID: 'yHum' },
      { label: 'Batas Suhu', data: [], borderColor: '#f39c12', borderDash: [6, 6], pointRadius: 0, fill: false, yAxisID: 'ySuhu' }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    scales: {
      ySuhu: { type: 'linear', position: 'left', title: { display: true, text: 'Suhu (°C)' } },
      yHum: { type: 'linear', position: 'right', title: { display: true, text: 'Kelembaban (%)' }, grid: { drawOnChartArea: false } }
    }
  }
});

function updateGrafik() {
  const data = riwayat.slice(-JUMLAH_TITIK_GRAFIK);
  grafik.data.labels = data.map(d => new Date(d.received).toLocaleTimeString());
  grafik.data.datasets[0].data = data.map(d => d.suhu);
  grafik.data.datasets[1].data = data.map(d => d.kelembaban);
  grafik.data.datasets[2].data = data.map(() => batasSekarang);
  grafik.update();
}

// ==============================
// TAMPILAN (kartu, status, tabel)
// ==============================
function setStatus(online) {
  const badge = document.getElementById('status-badge');
  badge.textContent = online ? 'ONLINE' : 'OFFLINE';
  badge.className = 'status-badge ' + (online ? 'status-online' : 'status-offline');
}

function renderHistory() {
  const tbody = document.getElementById('history-body');
  if (riwayat.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
    return;
  }
  tbody.innerHTML = riwayat.slice(-10).reverse().map(d => `
    <tr>
      <td>${new Date(d.received).toLocaleTimeString()}</td>
      <td>${d.suhu}</td>
      <td>${d.kelembaban}</td>
    </tr>
  `).join('');
}

function tampilkanBatas(json) {
  batasSekarang = json.threshold;
  document.getElementById('batas-nilai').textContent = json.threshold;

  const input = document.getElementById('input-batas');
  if (!input.dataset.diisi) {
    input.value = json.threshold;
    input.dataset.diisi = '1';
  }

  const banner = document.getElementById('alert-banner');
  if (json.over_limit) {
    banner.style.display = 'block';
    banner.textContent = `PERINGATAN: suhu ${json.data.suhu} °C melewati batas ${json.threshold} °C`;
    if (!sedangOver) log(`Notifikasi: suhu ${json.data.suhu} °C melewati batas ${json.threshold} °C`, 'error');
  } else {
    banner.style.display = 'none';
  }
  sedangOver = json.over_limit;
}

// Dipakai bersama oleh data awal (REST) dan data langsung (WebSocket)
function terapkanSensor(json) {
  if (!json.data || json.data.suhu === null) {
    setStatus(false);
    return;
  }
  dataTerakhir = Date.now();
  document.getElementById('suhu').textContent = json.data.suhu;
  document.getElementById('kelembaban').textContent = json.data.kelembaban;
  setStatus(true);
  tampilkanBatas(json);
}

// ==============================
// DATA AWAL via REST (hanya sekali saat halaman dibuka)
// ==============================
async function muatDataAwal() {
  try {
    terapkanSensor(await apiGet('/suhu'));
    const hist = await apiGet('/history');
    riwayat = hist.data || [];
    renderHistory();
    updateGrafik();
  } catch (err) {
    log(`Gagal memuat data awal: ${err.message}`, 'error');
  }
}

// ==============================
// WEBSOCKET (update tanpa polling)
// ==============================
function sambungWebSocket() {
  const ws = new WebSocket(WS_URL);

  ws.onopen = () => log('WebSocket terhubung, data masuk otomatis tanpa polling', 'info');

  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type !== 'sensor') return;
      terapkanSensor(msg);
      riwayat.push(msg.data);
      if (riwayat.length > 50) riwayat.shift();
      renderHistory();
      updateGrafik();
    } catch (err) {
      log(`Pesan WebSocket tidak valid: ${err.message}`, 'error');
    }
  };

  ws.onclose = () => {
    log('WebSocket terputus, mencoba sambung lagi dalam 3 detik...', 'error');
    setStatus(false);
    setTimeout(sambungWebSocket, 3000);
  };

  ws.onerror = () => ws.close();
}

// Tandai OFFLINE kalau lebih dari 10 detik tidak ada data baru
setInterval(() => {
  if (dataTerakhir && Date.now() - dataTerakhir > 10000) setStatus(false);
}, 5000);

// ==============================
// KONTROL LAMPU (POST)
// ==============================
async function kontrol(device, action) {
  try {
    const json = await apiPost('/kontrol', { device, action });
    if (json.status === 'success') {
      log(`Perintah terkirim: ${device} -> ${action}`, 'info');
    } else {
      log(`Gagal: ${json.message}`, 'error');
    }
  } catch (err) {
    log(`Error kontrol: ${err.message}`, 'error');
  }
}

// ==============================
// BATAS SUHU (PUT /api/threshold)
// ==============================
async function simpanBatas() {
  const nilai = parseFloat(document.getElementById('input-batas').value);
  if (isNaN(nilai)) {
    log('Isi batas suhu dengan angka', 'error');
    return;
  }
  try {
    const json = await apiPut('/threshold', { max: nilai });
    if (json.status === 'success') {
      log(`Batas suhu diubah menjadi ${json.threshold} °C`, 'info');
      terapkanSensor(await apiGet('/suhu'));
      updateGrafik();
    } else {
      log(`Gagal: ${json.message}`, 'error');
    }
  } catch (err) {
    log(`Error simpan batas: ${err.message}`, 'error');
  }
}

// ==============================
// MULAI
// ==============================
log('Dashboard dimulai, memuat data awal lalu beralih ke WebSocket...');
muatDataAwal();
sambungWebSocket();
</script>
</body>
</html>
